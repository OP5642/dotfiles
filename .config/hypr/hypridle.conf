# We first turn off the monitor
# NOTE: with the Lua config manager, `hyprctl dispatch` evaluates its argument as
# Lua, so the old `hyprctl dispatch dpms off` form is a syntax error.
listener {
    timeout = 400
    on-timeout = hyprctl dispatch 'hl.dsp.dpms("off")'
    on-resume = hyprctl dispatch 'hl.dsp.dpms("on")'
}
# Then we lock it after enough time
listener {
    timeout = 1000
    on-timeout = hyprlock
}
